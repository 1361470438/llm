<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Store Roof -->
  <path d="M12 28 L32 14 L52 28 Z" fill="url(#roofGrad)" filter="url(#glow)"/>
  <!-- Roof Ridge -->
  <polygon points="32,13 14,26 17,26 32,15 47,26 50,26" fill="#fbbf24"/>

  <!-- Shop Signboard -->
  <rect x="23" y="18" width="18" height="7" rx="1.5" fill="#78350f" stroke="#fef3c7" stroke-width="0.8"/>
  <text x="32" y="23.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="4.2" fill="#fff" text-anchor="middle">长鑫铺</text>

  <!-- Shop Walls -->
  <rect x="16" y="27" width="32" height="25" rx="1" fill="url(#wallGrad)" filter="url(#glow)"/>
  <rect x="15" y="50" width="34" height="3" rx="1" fill="#475569"/>

  <!-- Striped Awning -->
  <path d="M14 27 L17 35 L23 35 L21 27 Z" fill="#ef4444"/>
  <path d="M21 27 L23 35 L29 35 L27 27 Z" fill="#ffffff"/>
  <path d="M27 27 L29 35 L35 35 L33 27 Z" fill="#10b981"/>
  <path d="M33 27 L35 35 L41 35 L39 27 Z" fill="#ffffff"/>
  <path d="M39 27 L41 35 L47 35 L45 27 Z" fill="#ef4444"/>
  <path d="M45 27 L47 35 L50 35 L48 27 Z" fill="#ffffff"/>

  <!-- Glowing Shop Window / Showcase -->
  <rect x="19" y="37" width="13" height="12" rx="1.5" fill="url(#windowGlow)" stroke="#b45309" stroke-width="0.8"/>
  <line x1="19" y1="43" x2="32" y2="43" stroke="#b45309" stroke-width="0.8"/>
  <line x1="25.5" y1="37" x2="25.5" y2="49" stroke="#b45309" stroke-width="0.8"/>

  <!-- Door with Warm Interior -->
  <rect x="34" y="37" width="11" height="13" rx="1" fill="#ea580c" stroke="#78350f" stroke-width="0.8"/>
  <rect x="36" y="39" width="7" height="6" rx="0.5" fill="#fef08a"/>
  <!-- Door knob -->
  <circle cx="43" cy="45" r="0.9" fill="#fbbf24"/>

  <!-- Warm lantern -->
  <circle cx="16" cy="34" r="2" fill="#fbbf24" filter="url(#glow)"/>
</svg>
